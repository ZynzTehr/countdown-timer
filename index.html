<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Flip Countdown Timer</title>
  <meta name="description" content="A cool, modern 3D split flip countdown timer with customizable purples, pinks, and orange aesthetics.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- SCSS Entry -->
  <link rel="stylesheet" href="/src/scss/main.scss">
</head>
<body>
  <!-- Ambient Particle Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- App Wrapper -->
  <div class="app-container">
    
    <!-- Header -->
    <header class="app-header">

      <h1 class="main-title">COUNTDOWN TIMER</h1>
      
      <div class="target-banner">
        <span id="target-status">COUNTING DOWN TO:</span>
        <span class="target-event-name" id="target-event-name">New Year 2027</span>
      </div>

      <!-- Action Toolbar -->
      <div class="action-bar">
        <button id="btn-open-settings" class="btn-glow">
          <svg viewBox="0 0 24 24">
            <path d="M19 4h-1V3c0-.55-.45-1-1-1s-1 .45-1 1v1H7V3c0-.55-.45-1-1-1s-1 .45-1 1v1H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h15c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H4V9h15v11zM7 11h5v5H7z"/>
          </svg>
          Set Target Date & Time
        </button>

        <button id="btn-sound-toggle" class="btn-glow btn-icon-only" title="Toggle Sound">
          <svg id="sound-icon" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </div>


    </header>

    <!-- Animated Completion Banner (Shown when timer reaches absolute zero) -->
    <div class="completion-banner" id="completion-banner" style="display: none;">
      <div class="completion-badge">✨ EVENT REACHED ✨</div>
      <h2 class="completion-title" id="completion-title">CELEBRATION TIME!</h2>
      <p class="completion-subtitle" id="completion-subtitle">The waited moment has arrived.</p>
      <button id="btn-completion-reset" class="btn-glow" style="margin-top: 1.5rem;">
        Set Next Target
      </button>
    </div>

    <!-- Main 6-Unit 3D Flip Clock Grid -->
    <main class="flip-clock-grid" id="flip-clock-grid">
      
      <!-- Years -->
      <div class="flip-unit-card" data-unit="years">
        <div class="flip-clock-unit"></div>
        <div class="unit-label"><span class="label-text">Years</span></div>
      </div>

      <!-- Months -->
      <div class="flip-unit-card" data-unit="months">
        <div class="flip-clock-unit"></div>
        <div class="unit-label"><span class="label-text">Months</span></div>
      </div>

      <!-- Days -->
      <div class="flip-unit-card" data-unit="days">
        <div class="flip-clock-unit"></div>
        <div class="unit-label"><span class="label-text">Days</span></div>
      </div>

      <!-- Hours -->
      <div class="flip-unit-card" data-unit="hours">
        <div class="flip-clock-unit"></div>
        <div class="unit-label"><span class="label-text">Hours</span></div>
      </div>

      <!-- Minutes -->
      <div class="flip-unit-card" data-unit="minutes">
        <div class="flip-clock-unit"></div>
        <div class="unit-label"><span class="label-text">Minutes</span></div>
      </div>

      <!-- Seconds -->
      <div class="flip-unit-card" data-unit="seconds">
        <div class="flip-clock-unit"></div>
        <div class="unit-label"><span class="label-text">Seconds</span></div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span>Crafted with SCSS & 3D Web Mechanics</span>
    </footer>

  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Countdown Settings</h2>
        <button type="button" class="btn-close" id="btn-close-settings">&times;</button>
      </div>

      <form id="settings-form">
        <div class="form-group">
          <label for="input-event-name">Event Title</label>
          <input type="text" id="input-event-name" placeholder="e.g. Next Big Launch" required>
        </div>

        <div class="form-group">
          <label for="input-target-date">Target Date & Time</label>
          <input type="datetime-local" id="input-target-date" required>
        </div>

        <div class="form-group">
          <label>Quick Presets</label>
          <div class="preset-pills" id="preset-pills-container"></div>
        </div>

        <div class="toggle-group">
          <span>Show Leading Zeros</span>
          <label class="switch">
            <input type="checkbox" id="input-leading-zeros" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggle-group">
          <span>Flip Sound Effects</span>
          <label class="switch">
            <input type="checkbox" id="input-sound-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>

        <button type="submit" id="btn-save-settings" class="btn-glow" style="width: 100%; justify-content: center; margin-top: 1.5rem;">
          Save & Apply Countdown
        </button>
      </form>
    </div>
  </div>

  <!-- JS Module Entry -->
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
